version: '3.9'

services:
  backend:
    build: ./backend-go
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      # 上传文件持久化
      - ./uploads:/opt/simnexus/uploads
      # 挂载宿主机 D-Bus socket，使容器内 mmcli 可访问宿主机 ModemManager
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
      - /dev/bus/usb:/dev/bus/usb
    environment:
      - DATABASE_URL=sqlite:////app/data/sim_manager.db
      - DBUS_SYSTEM_BUS_ADDRESS=unix:path=/run/dbus/system_bus_socket
      # 从同目录 .env 读取（.env 已被 .gitignore 忽略，勿硬编码真实值）
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      # 可选：允许发命令的额外 chat_id（逗号分隔）
      - TELEGRAM_ALLOWED_CHAT_IDS=${TELEGRAM_ALLOWED_CHAT_IDS:-}
      # VoWiFi：详细日志（排障用）+ USIM AKA 顺序（at=AT优先，QMI兜底）
      - VOWIFI_VERBOSE=${VOWIFI_VERBOSE:-1}
      - VOWIFI_AKA_ORDER=${VOWIFI_AKA_ORDER:-at}
      # ePDG 动态解析（第二方案）：=1 时用 DoH 解析 ePDG FQDN（绕过 Clash fake-ip），
      # 校验/追随运营商 ePDG；解析失败自动回退到 vowifi_epdg_ip 配置值
      - VOWIFI_EPDG_DNS=${VOWIFI_EPDG_DNS:-1}
    privileged: true
    group_add:
      - dialout

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8899:80"
    depends_on:
      - backend
